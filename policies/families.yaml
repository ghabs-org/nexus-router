# families.yaml
# Provider/model family scoring priors.
# These are heuristic baselines. Override per-model in overrides.yaml.
# All scores: 0.0–1.0 (higher = better for that dimension)
#
# Dimensions:
#   coding      — code generation, implementation, bug fixing
#   review      — code review, quality analysis, audit
#   reasoning   — planning, comparison, strategy, decision-making
#   summarize   — extraction, synthesis, TL;DR
#   fast        — speed / latency
#   cost        — cost efficiency (1.0 = cheapest)
#   context     — ability to handle large contexts (1.0 = largest window)
#   vision      — image/screenshot/diagram understanding
#   tools       — reliable tool/function calling
#   multilingual — non-English quality

families:

  # ── OpenAI Codex (subscription-auth Codex routing) ─────────────────────────
  openai-codex:
    default:
      coding: 0.92
      review: 0.78
      reasoning: 0.82
      summarize: 0.74
      fast: 0.68
      cost: 0.55
      context: 0.78
      vision: 0.74
      tools: 0.90
      multilingual: 0.78
    patterns:
      - match: "gpt-5.4$"
        overrides:
          coding: 0.96
          reasoning: 0.85
          review: 0.82
          tools: 0.92
      - match: "gpt-5.4-mini$"
        overrides:
          coding: 0.84
          fast: 0.88
          cost: 0.82
          tools: 0.86
      - match: "gpt-5.3-codex$"
        overrides:
          coding: 0.93
          tools: 0.91
      - match: "gpt-5.3-codex-spark$"
        overrides:
          coding: 0.88
          fast: 0.84
          cost: 0.76
      - match: "gpt-5.2(-codex)?$"
        overrides:
          coding: 0.89
          tools: 0.87
      - match: "gpt-5.1.*"
        overrides:
          coding: 0.85
          tools: 0.84
      - match: "gpt-5.1-codex-max$"
        overrides:
          coding: 0.90
          context: 0.82

