# routing.yaml
# Default routing policy: task type → provider/model preferences
# Models are tried in order; first authed+healthy model wins.
# auth_required: true means skip if not authed
# min_context: minimum context window needed

routing:

  coding:
    description: "Code generation, implementation, bug fixing, refactoring"
    candidates:
      - model: anthropic/claude-opus-5-5
        priority: 1
      - model: openai/gpt-6-astra
        priority: 2
      - model: openai/gpt-6.1-sol
        priority: 3
      - model: nvidia/nemotron-3-ultra-550b-a55b
        priority: 4

  code_review:
    description: "Code review, diff analysis, PR audit, quality feedback"
    candidates:
      - model: anthropic/claude-opus-5-5
        priority: 1
      - model: openai/gpt-6-astra
        priority: 2
      - model: openai/gpt-6.1-sol
        priority: 3
      - model: nvidia/nemotron-3-ultra-550b-a55b
        priority: 4

  reasoning:
    description: "Planning, strategy, comparison, decision-making, architecture"
    candidates:
      - model: anthropic/claude-opus-5-5
        priority: 1
      - model: openai/gpt-6-astra
        priority: 2
      - model: openai/gpt-6.1-sol
        priority: 3
      - model: nvidia/nemotron-3-ultra-550b-a55b
        priority: 4

  summarization:
    description: "Summarize, extract, distill, TL;DR, synthesis of large content"
    candidates:
      - model: anthropic/claude-opus-5-5
        priority: 1
      - model: openai/gpt-6.1-sol
        priority: 2
      - model: openai/gpt-6-luna
        priority: 3
      - model: nvidia/nemotron-3-ultra-550b-a55b
        priority: 4

  fast_utility:
    description: "Quick lookups, simple rewrites, short answers, minor edits"
    candidates:
      - model: openai/gpt-6-luna
        priority: 1
      - model: nvidia/nemotron-3-ultra-550b-a55b
        priority: 2
      - model: nvidia/google/gemma-4-31b-it
        priority: 3

  long_context:
    description: "Large documents, many files, long transcripts, multi-section analysis"
    min_context: 200000
    candidates:
      - model: anthropic/claude-opus-5-5
        priority: 1
      - model: openai/gpt-6.1-sol
        priority: 2
      - model: openai/gpt-6-astra
        priority: 3
      - model: nvidia/nemotron-3-ultra-550b-a55b
        priority: 4

  vision:
    description: "Image understanding, screenshots, diagrams, photos"
    requires_vision: true
    candidates:
      - model: anthropic/claude-opus-5-5
        priority: 1
      - model: openai/gpt-6-astra
        priority: 2
      - model: openai/gpt-6.1-sol
        priority: 3
      - model: nvidia/google/gemma-4-31b-it
        priority: 4

  general_chat:
    description: "Conversational, general questions, advice, non-specialized tasks"
    candidates:
      - model: anthropic/claude-opus-5-5
        priority: 1
      - model: openai/gpt-6.1-sol
        priority: 2
      - model: openai/gpt-6-luna
        priority: 3
      - model: nvidia/nemotron-3-ultra-550b-a55b
        priority: 4

  eco:
    description: "Environmentally friendly, efficient, small-footprint models"
    candidates:
      - model: nvidia/nemotron-3-ultra-550b-a55b
        priority: 1
      - model: nvidia/google/gemma-4-31b-it
        priority: 2
      - model: openai/gpt-6-luna
        priority: 3

scoring:
  confidence_gate:
    min_confidence: 0.65

  fitted_weights:
    enabled: true
    min_samples_per_task: 40
    artifact_path: ~/.local/state/nexus-router/artifacts/scorer/fitted_weights.active.json

  exploration:
    enabled: true
    strategy: thompson
    epsilon: 0.03
    top_k: 3
    family_prior_strength: 6.0
    uncertainty_bonus: 0.08
    shadow_log_challenger: true
