# routing.yaml
# Default routing policy: task type → provider/model preferences
# Models are tried in order; first authed+healthy model wins.
# auth_required: true means skip if not authed
# min_context: minimum context window needed

# CLI interception is independent of the advisory /route scoring policy.
# Provider IDs must match enabled rows in the router's SQLite providers table.
# base_url is the upstream origin (optionally ending in /v1), NEVER the proxy.
cli_proxy:
  min_health_score: 0.8
  max_pins: 4096
  pin_ttl_seconds: 86400
  connect_timeout_seconds: 5
  read_timeout_seconds: 300
  providers:
    anthropic:
      base_url: https://api.anthropic.com
      protocols: [messages]
      api_key_env: ANTHROPIC_API_KEY
    openai-codex:
      base_url: https://api.openai.com
      protocols: [chat, responses]
      api_key_env: OPENAI_API_KEY
    nvidia:
      base_url: https://integrate.api.nvidia.com/v1
      protocols: [chat]
      api_key_env: NVIDIA_API_KEY
    local:
      base_url: http://127.0.0.1:11434/v1
      protocols: [chat]
    # Subscription backend: llm-cli-proxy (../llm-cli-proxy) runs claude/codex/agy/
    # copilot/opencode on this machine's logins and serves Chat Completions on :8811.
    # Keyless on purpose. Fail-closed until you add an enabled `subscription` row to
    # the providers table. Targets: subscription:cc:sonnet, subscription:codex:gpt-6.1-sol ...
    # Limits: chat only, so Messages traffic with images/thinking cannot use it (mostly
    # housekeeping/worker and Codex chat); its streaming is simulated (keepalives, then
    # the whole answer); tools are emulated in the prompt; a usage limit hit after the
    # keepalive commit cannot fail over.
    # subscription:
    #   base_url: http://127.0.0.1:8811/v1
    #   protocols: [chat]
  # static: always the configured order. learned: for new (unpinned) sessions, a later
  # target moves ahead when its health x 24h success (latency-penalized) beats an
  # earlier one by learned_margin. Pins and native-protocol preference still win.
  ordering: static
  learned_margin: 0.15
  routes:
    STATELESS_HOUSEKEEPING: ["local:qwen3:8b", "nvidia:google/gemma-4-31b-it", "openai-codex:gpt-6-luna"]
    SUBAGENT_WORKER: ["local:qwen3:8b", "nvidia:google/gemma-4-31b-it", "openai-codex:gpt-6-luna"]
    MAIN_PLANNING: ["anthropic:claude-opus-5-5", "openai-codex:gpt-6-astra"]
    MAIN_EXECUTION: ["anthropic:claude-opus-5-5", "openai-codex:gpt-6.1-sol"]

routing:

  coding:
    description: "Code generation, implementation, bug fixing, refactoring"
    candidates:
      - model: anthropic/claude-opus-5-5
        priority: 1
      - model: openai/gpt-6-astra
        priority: 2
      - model: openai/gpt-6.1-sol
        priority: 3
      - model: nvidia/nemotron-3-ultra-550b-a55b
        priority: 4

  code_review:
    description: "Code review, diff analysis, PR audit, quality feedback"
    candidates:
      - model: anthropic/claude-opus-5-5
        priority: 1
      - model: openai/gpt-6-astra
        priority: 2
      - model: openai/gpt-6.1-sol
        priority: 3
      - model: nvidia/nemotron-3-ultra-550b-a55b
        priority: 4

  reasoning:
    description: "Planning, strategy, comparison, decision-making, architecture"
    candidates:
      - model: anthropic/claude-opus-5-5
        priority: 1
      - model: openai/gpt-6-astra
        priority: 2
      - model: openai/gpt-6.1-sol
        priority: 3
      - model: nvidia/nemotron-3-ultra-550b-a55b
        priority: 4

  summarization:
    description: "Summarize, extract, distill, TL;DR, synthesis of large content"
    candidates:
      - model: anthropic/claude-opus-5-5
        priority: 1
      - model: openai/gpt-6.1-sol
        priority: 2
      - model: openai/gpt-6-luna
        priority: 3
      - model: nvidia/nemotron-3-ultra-550b-a55b
        priority: 4

  fast_utility:
    description: "Quick lookups, simple rewrites, short answers, minor edits"
    candidates:
      - model: openai/gpt-6-luna
        priority: 1
      - model: nvidia/nemotron-3-ultra-550b-a55b
        priority: 2
      - model: nvidia/google/gemma-4-31b-it
        priority: 3

  long_context:
    description: "Large documents, many files, long transcripts, multi-section analysis"
    min_context: 200000
    candidates:
      - model: anthropic/claude-opus-5-5
        priority: 1
      - model: openai/gpt-6.1-sol
        priority: 2
      - model: openai/gpt-6-astra
        priority: 3
      - model: nvidia/nemotron-3-ultra-550b-a55b
        priority: 4

  vision:
    description: "Image understanding, screenshots, diagrams, photos"
    requires_vision: true
    candidates:
      - model: anthropic/claude-opus-5-5
        priority: 1
      - model: openai/gpt-6-astra
        priority: 2
      - model: openai/gpt-6.1-sol
        priority: 3
      - model: nvidia/google/gemma-4-31b-it
        priority: 4

  general_chat:
    description: "Conversational, general questions, advice, non-specialized tasks"
    candidates:
      - model: anthropic/claude-opus-5-5
        priority: 1
      - model: openai/gpt-6.1-sol
        priority: 2
      - model: openai/gpt-6-luna
        priority: 3
      - model: nvidia/nemotron-3-ultra-550b-a55b
        priority: 4

  eco:
    description: "Environmentally friendly, efficient, small-footprint models"
    candidates:
      - model: nvidia/nemotron-3-ultra-550b-a55b
        priority: 1
      - model: nvidia/google/gemma-4-31b-it
        priority: 2
      - model: openai/gpt-6-luna
        priority: 3

scoring:
  confidence_gate:
    min_confidence: 0.65

  fitted_weights:
    enabled: true
    min_samples_per_task: 40
    artifact_path: ~/.local/state/nexus-router/artifacts/scorer/fitted_weights.active.json

  exploration:
    enabled: true
    strategy: thompson
    epsilon: 0.03
    top_k: 3
    family_prior_strength: 6.0
    uncertainty_bonus: 0.08
    shadow_log_challenger: true

# Per-model circuit breaker (src/cooldowns.py). Advisory: a failed /outcome counts
# against the decision's model on its task type. CLI proxy: 5xx/timeouts/404 count
# against provider:model on its call category. 429/auth stay provider-level.
cooldowns:
  failures: 3
  window_seconds: 60
  cooldown_seconds: 300

# A/B policy experiment (advisory /route only). The second variant gets `split` of
# experiment keys (the plugin sends its conversation key); each variant deep-merges
# over `scoring:` for that call. Decisions carry policy_id "<id>:<variant>".
# Compare with: python scripts/policy_experiment_report.py --experiment <id>
# experiment:
#   id: exploration-off-2026-11
#   split: 0.5
#   variants:
#     control: {}
#     candidate:
#       exploration:
#         enabled: false
