# routing.yaml
# Default routing policy: task type → provider/model preferences
# Models are tried in order; first authed+healthy model wins.
# auth_required: true means skip if not authed
# min_context: minimum context window needed

routing:

  coding:
    description: "Code generation, implementation, bug fixing, refactoring"
    candidates:
      - model: openai-codex/gpt-5.5
        priority: 1
      - model: nvidia/qwen/qwen3-coder-480b-a35b-instruct
        priority: 2
      - model: openai-codex/gpt-5.4
        priority: 3
      - model: openrouter/qwen/qwen3-coder:free
        priority: 4
      - model: openai-codex/gpt-5.3-codex
        priority: 5
      - model: github-copilot/gpt-5.3-codex
        priority: 6
      - model: github-copilot/gpt-5.4
        priority: 7
      - model: github-copilot/claude-sonnet-4.6
        priority: 8
      - model: nvidia/deepseek-ai/deepseek-v4-pro
        priority: 9
      - model: openai-codex/gpt-5.4-mini
        priority: 10
  code_review:
    description: "Code review, diff analysis, PR audit, quality feedback"
    candidates:
      - model: github-copilot/claude-sonnet-4.6
        priority: 1
      - model: github-copilot/claude-opus-4.6
        priority: 2
      - model: openai-codex/gpt-5.5
        priority: 3
      - model: nvidia/deepseek-ai/deepseek-v4-pro
        priority: 4
      - model: openai-codex/gpt-5.4
        priority: 5
      - model: github-copilot/gpt-5.4
        priority: 6
      - model: nvidia/qwen/qwen3-coder-480b-a35b-instruct
        priority: 7
      - model: google-gemini-cli/gemini-3.1-pro-preview
        priority: 8
  reasoning:
    description: "Planning, strategy, comparison, decision-making, architecture"
    candidates:
      - model: openai-codex/gpt-5.5
        priority: 1
      - model: github-copilot/claude-sonnet-4.6
        priority: 2
      - model: github-copilot/claude-opus-4.6
        priority: 3
      - model: nvidia/deepseek-ai/deepseek-v4-pro
        priority: 4
      - model: google-gemini-cli/gemini-3.1-pro-preview
        priority: 5
      - model: openai-codex/gpt-5.4
        priority: 6
      - model: github-copilot/gpt-5.4
        priority: 7
  summarization:
    description: "Summarize, extract, distill, TL;DR, synthesis of large content"
    candidates:
      - model: google-gemini-cli/gemini-3.1-pro-preview
        priority: 1
      - model: github-copilot/gemini-3.1-pro-preview
        priority: 2
      - model: github-copilot/claude-sonnet-4.6
        priority: 3
      - model: openai-codex/gpt-5.5
        priority: 4
      - model: nvidia/deepseek-ai/deepseek-v4-pro
        priority: 5
      - model: openai-codex/gpt-5.4-mini
        priority: 6
      - model: google-gemini-cli/gemini-2.5-flash
        priority: 7
  fast_utility:
    description: "Quick lookups, simple rewrites, short answers, minor edits"
    candidates:
      - model: nvidia/deepseek-ai/deepseek-v4-flash
        priority: 1
      - model: openai-codex/gpt-5.4-mini
        priority: 2
      - model: google-gemini-cli/gemini-3-flash-preview
        priority: 3
      - model: google-gemini-cli/gemini-2.5-flash
        priority: 4
      - model: github-copilot/gpt-5.4-mini
        priority: 5
      - model: github-copilot/gpt-5-mini
        priority: 6
      - model: openrouter/qwen/qwen3-coder:free
        priority: 7
  long_context:
    description: "Large documents, many files, long transcripts, multi-section analysis"
    min_context: 200000
    candidates:
      - model: openai-codex/gpt-5.5
        priority: 1
      - model: google-gemini-cli/gemini-3.1-pro-preview
        priority: 2
      - model: github-copilot/gemini-3.1-pro-preview
        priority: 3
      - model: nvidia/qwen/qwen3-coder-480b-a35b-instruct
        priority: 4
      - model: openrouter/qwen/qwen3-coder:free
        priority: 5
      - model: github-copilot/claude-sonnet-4.6
        priority: 6
      - model: github-copilot/claude-opus-4.6
        priority: 7
  vision:
    description: "Image understanding, screenshots, diagrams, photos"
    requires_vision: true
    candidates:
      - model: google-gemini-cli/gemini-3.1-pro-preview
        priority: 1
      - model: openai-codex/gpt-5.5
        priority: 2
      - model: github-copilot/claude-sonnet-4.6
        priority: 3
      - model: github-copilot/gemini-3.1-pro-preview
        priority: 4
      - model: openai-codex/gpt-5.4
        priority: 5
  general_chat:
    description: "Conversational, general questions, advice, non-specialized tasks"
    candidates:
      - model: openai-codex/gpt-5.5
        priority: 1
      - model: openai-codex/gpt-5.4
        priority: 2
      - model: github-copilot/claude-sonnet-4.6
        priority: 3
      - model: google-gemini-cli/gemini-3.1-pro-preview
        priority: 4
      - model: nvidia/deepseek-ai/deepseek-v4-flash
        priority: 5
      - model: openai-codex/gpt-5.4-mini
        priority: 6
  eco:
    description: "Environmentally friendly, efficient, small-footprint models"
    candidates:
      - model: nvidia/deepseek-ai/deepseek-v4-flash
        priority: 1
      - model: openrouter/qwen/qwen3-coder:free
        priority: 2
      - model: nvidia/qwen/qwen3-coder-480b-a35b-instruct
        priority: 3
      - model: google-gemini-cli/gemini-3-flash-preview
        priority: 4
      - model: openai-codex/gpt-5.4-mini
        priority: 5
      - model: google-gemini-cli/gemini-2.5-flash
        priority: 6
      - model: github-copilot/gpt-5.4-mini
        priority: 7
