# benchmark-scores.yaml
#
# Benchmark-derived capability scores for the Nexus Router.
# These override family-prior heuristics when present.
#
# Format per model:
#   models:
#     "provider/model-id":
#       coding:       0.0-1.0   # HumanEval / LiveCodeBench
#       review:       0.0-1.0   # proxy: instruction_following × reasoning
#       reasoning:    0.0-1.0   # MATH / LiveBench reasoning / MMLU-Pro
#       summarize:    0.0-1.0   # proxy: instruction_following × output_quality
#       fast:         0.0-1.0   # artificialanalysis.ai tokens/s, normalized
#       cost:         0.0-1.0   # 1.0 = cheapest; derived from $/M tokens
#       context:      0.0-1.0   # derived from actual context window
#       vision:       0.0-1.0   # VQA / MMMU benchmark score (0 if text-only)
#       tools:        0.0-1.0   # BFCL (Berkeley Function Calling Leaderboard)
#       multilingual: 0.0-1.0   # MGSM or multilingual reasoning benchmark
#       _confidence:
#         coding:     0.0-1.0   # confidence in the merged dimension score
#         reasoning:  0.0-1.0   # higher with more trusted agreeing sources
#       _source:      string    # merged source labels, e.g. "artificialanalysis+livebench"
#       _sources:     [string]  # optional explicit contributing source list
#       _updated_at:  string    # ISO date of last update
#
# Cross-source merge rule:
#   final_dim = sum(weight(source) * value(source)) / sum(weight(source))
#   using only sources that actually provide that dimension.
#
# Per-dimension confidence metadata (_confidence.<dim>) is computed from:
#   base_count_conf  = min(1.0, contributors / 3)
#   base_weight_conf = min(1.0, total_weight / 2.0)
#   agreement_conf   = 0.65 for a single source, otherwise
#                      1.0 - min(1.0, stddev(values) / 0.25)
#   final_conf       = 0.4*base_count_conf + 0.3*base_weight_conf + 0.3*agreement_conf
# This keeps single-source confidence moderate, rewards multi-source agreement,
# and penalizes strong disagreement without changing the underlying score values.
#
# Default trust weights used by src/fetch_benchmarks.py:
#   artificialanalysis=1.0, livebench=1.0, helm=0.9, inspect_ai=0.9,
#   openllm=0.9, vellum=0.9, bfcl=1.0, mgsm=1.0, unknown=1.0
#
# Score normalization rules:
#   coding:       HumanEval pass@1 / 100
#   reasoning:    LiveBench reasoning composite / 100
#   fast:         min(provider_tps / 200, 1.0)  — 200 tok/s = 1.0
#   cost:         1.0 - min(avg_cost_per_M / 20.0, 1.0)  — $20/M = 0.0
#   context:      derived from window size (see generate_registry.py)
#   tools:        BFCL overall accuracy / 100
#   multilingual: MGSM composite / 100
#
# Sources:
#   artificialanalysis.ai — speed, cost, quality composite
#   livebench.ai          — reasoning, coding, instruction following
#   crfm.stanford.edu/helm — reasoning / review proxies when available
#   inspect.aisi.org.uk / inspect_evals — best-effort public Inspect AI results feed
#   huggingface.co/datasets/open-llm-leaderboard/contents — open-model reasoning / review proxies
#   vellum.ai/llm-leaderboard — multi-task quality
#   scale.com/leaderboard — coding, reasoning
#   berkeley-nest/gorilla (BFCL) — tool use / function calling
#
# This file is intentionally sparse on initial commit.
# Populate it by running: python src/fetch_benchmarks.py
# Or manually add entries below as you gather data.

_meta:
  description: "Benchmark-derived model scores for Nexus Router"
  sources:
    - id: artificialanalysis
      url: "https://artificialanalysis.ai/leaderboards/models"
      dimensions: [fast, cost, context]
      update_cadence: monthly
    - id: livebench
      url: "https://livebench.ai"
      dimensions: [reasoning, coding]
      update_cadence: monthly
    - id: helm
      url: "https://crfm.stanford.edu/helm/classic/latest/"
      dimensions: [reasoning, review]
      update_cadence: occasional
    - id: inspect_ai
      url: "https://inspect.aisi.org.uk/"
      dimensions: [reasoning]
      update_cadence: best-effort
    - id: openllm
      url: "https://huggingface.co/datasets/open-llm-leaderboard/contents"
      dimensions: [reasoning, review, summarize]
      update_cadence: occasional
    - id: vellum
      url: "https://vellum.ai/llm-leaderboard"
      dimensions: [coding, reasoning, review]
      update_cadence: monthly
    - id: bfcl
      url: "https://gorilla.cs.berkeley.edu/leaderboard.html"
      dimensions: [tools]
      update_cadence: monthly
    - id: mgsm
      url: "https://github.com/google-research/url-nlp/tree/main/mgsm"
      dimensions: [multilingual]
      update_cadence: yearly

