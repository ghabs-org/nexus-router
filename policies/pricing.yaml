# pricing.yaml — USD per million tokens, for outcome cost estimates (src/pricing.py).
# Keys are exact provider/model ids or fnmatch globs; the most specific match wins.
# long_context: prices for a whole request whose input exceeds above_input_tokens.
# Cache reads/writes are not split out: they are priced as base input (an upper bound).
#
# Checked 2026-11-08 against the official pages:
#   https://platform.claude.com/docs/en/about-claude/pricing
#   https://developers.openai.com/api/docs/pricing
# Re-check when providers change prices. gpt-5.6-sol is promotional until 2026-11-30.
models:
  # Anthropic API (Claude 4.6+ and Opus/Sonnet 5.5 keep 1M context at standard rates)
  "anthropic/claude-fable-5-1": {input_per_mtok: 10.0, output_per_mtok: 50.0}
  "anthropic/claude-opus-5-5": {input_per_mtok: 4.0, output_per_mtok: 20.0}
  "anthropic/claude-sonnet-5-5": {input_per_mtok: 2.0, output_per_mtok: 10.0}
  "anthropic/claude-haiku-5-5":
    input_per_mtok: 0.10
    output_per_mtok: 0.50
    long_context: {above_input_tokens: 100000, input_per_mtok: 0.50, output_per_mtok: 2.50}

  # OpenAI API (long-context rates apply above 272K input tokens)
  "openai/gpt-6.1-sol":
    input_per_mtok: 2.0
    output_per_mtok: 10.0
    long_context: {above_input_tokens: 272000, input_per_mtok: 4.0, output_per_mtok: 15.0}
  "openai/gpt-6-sol":
    input_per_mtok: 2.0
    output_per_mtok: 10.0
    long_context: {above_input_tokens: 272000, input_per_mtok: 4.0, output_per_mtok: 15.0}
  "openai/gpt-6-astra":
    input_per_mtok: 10.0
    output_per_mtok: 50.0
    long_context: {above_input_tokens: 272000, input_per_mtok: 20.0, output_per_mtok: 75.0}
  "openai/gpt-6-luna":
    input_per_mtok: 0.10
    output_per_mtok: 0.50
    long_context: {above_input_tokens: 272000, input_per_mtok: 0.20, output_per_mtok: 0.75}
  "openai/gpt-5.6-sol":
    input_per_mtok: 4.0
    output_per_mtok: 20.0
    long_context: {above_input_tokens: 272000, input_per_mtok: 8.0, output_per_mtok: 30.0}
  "openai/gpt-5.6-terra":
    input_per_mtok: 2.0
    output_per_mtok: 12.0
    long_context: {above_input_tokens: 272000, input_per_mtok: 4.0, output_per_mtok: 18.0}
  "openai/gpt-5.6-luna":
    input_per_mtok: 0.20
    output_per_mtok: 1.20
    long_context: {above_input_tokens: 272000, input_per_mtok: 0.40, output_per_mtok: 1.80}

  # Free endpoints
  "nvidia/*": {input_per_mtok: 0.0, output_per_mtok: 0.0}
  "openrouter/*:free": {input_per_mtok: 0.0, output_per_mtok: 0.0}

# Flat-rate logins: no per-call price, so their marginal cost is 0.
subscription_providers:
  - openai-codex
  - github-copilot
  - google-antigravity
  - google-gemini-cli
