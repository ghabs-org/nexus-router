services:
  nexus-router:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nexus-router:latest
    container_name: nexus-router-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:7771:7771"
    volumes:
      - ../catalog:/app/catalog
      - ../policies:/app/policies
      - /home/ubuntu/.local/state/nexus-router/state:/app/state
      - /home/ubuntu/.local/state/nexus-router/data:/app/data
      - /home/ubuntu/.openclaw:/root/.openclaw:ro
      - /home/ubuntu/.codex:/root/.codex:ro
    environment:
      - PYTHONUNBUFFERED=1
      - NEXUS_ROUTER_DB_PATH=/app/data/routing-history.sqlite
      - NEXUS_ROUTER_HEALTH_FILE=/app/state/runtime-health.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7771/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - nexus_default

networks:
  nexus_default:
    external: true
