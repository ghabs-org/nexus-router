[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-router-gateway"
version = "0.2.0"
description = "Cache-aware Claude Cowork gateway with Vertex AI model and effort routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7", "google-auth[requests]>=2.30,<3", "PyJWT[crypto]>=2.8,<3"]

[project.optional-dependencies]
classifier = ["numpy>=2", "onnxruntime>=1.20", "tokenizers>=0.20"]

[project.scripts]
nexus-router-gateway = "nexus_router.gateway_cli:main"

[tool.setuptools]
packages = ["nexus_router"]
package-dir = {nexus_router = "src"}

[tool.setuptools.package-data]
nexus_router = ["schema.sql", "gateway.example.yaml", "gateway.codex.yaml", "gateway_dashboard.html", "gateway_dashboard.js", "gateway_dashboard.css"]
